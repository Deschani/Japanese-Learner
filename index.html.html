<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Japanese Phrase Learner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 2rem;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }

        h1 {
            text-align: center;
            color: #1a1a2e;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 2rem;
        }

        .flashcard {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 3rem 2rem;
            text-align: center;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid #e9ecef;
            margin-bottom: 1.5rem;
        }

        .flashcard:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .japanese {
            font-size: 2.5rem;
            font-weight: bold;
            color: #1a1a2e;
            margin-bottom: 0.5rem;
        }

        .english {
            font-size: 1.5rem;
            color: #666;
            display: none;
        }

        .english.show {
            display: block;
        }

        .hint {
            font-size: 0.9rem;
            color: #999;
            margin-top: 1rem;
        }

        .controls {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin: 1.5rem 0;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 25px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover {
            transform: scale(1.05);
        }

        .btn-prev {
            background: #e9ecef;
            color: #333;
        }

        .btn-next {
            background: #0f3460;
            color: white;
        }

        .btn-shuffle {
            background: #e94560;
            color: white;
        }

        .btn-add {
            background: #28a745;
            color: white;
            width: 100%;
            margin-top: 0.5rem;
        }

        .progress {
            text-align: center;
            color: #666;
            font-size: 0.9rem;
            margin: 1rem 0;
        }

        .add-section {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 2px solid #e9ecef;
        }

        .add-section h3 {
            margin-bottom: 1rem;
            color: #1a1a2e;
        }

        .add-form {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .add-form input {
            padding: 12px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 1rem;
        }

        .add-form input:focus {
            outline: none;
            border-color: #0f3460;
        }

        .form-row {
            display: flex;
            gap: 0.75rem;
        }

        .form-row input {
            flex: 1;
        }

        .btn-add-small {
            background: #28a745;
            color: white;
            padding: 12px;
            border-radius: 10px;
        }

        .btn-remove {
            background: #dc3545;
            color: white;
            padding: 5px 10px;
            font-size: 0.8rem;
            margin-left: 10px;
            border-radius: 5px;
        }

        .phrase-list {
            margin-top: 1rem;
            max-height: 200px;
            overflow-y: auto;
        }

        .phrase-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: #f8f9fa;
            margin-bottom: 5px;
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .phrase-item .jp {
            font-weight: 600;
            color: #1a1a2e;
        }

        .phrase-item .en {
            color: #666;
        }

        @media (max-width: 500px) {
            .container { padding: 1rem; }
            .japanese { font-size: 2rem; }
            .english { font-size: 1.2rem; }
            .form-row { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🇯🇵 Japanese Phrase Learner</h1>
        <p class="subtitle">Click the card to reveal translation</p>

        <div class="flashcard" id="flashcard">
            <div class="japanese" id="japaneseText">こんにちは</div>
            <div class="english" id="englishText">Hello</div>
            <div class="hint">👆 Tap to reveal</div>
        </div>

        <div class="progress" id="progress">1 / 10</div>

        <div class="controls">
            <button class="btn-prev" onclick="prevCard()">◀ Previous</button>
            <button class="btn-shuffle" onclick="shuffleCards()">🔀 Shuffle</button>
            <button class="btn-next" onclick="nextCard()">Next ▶</button>
        </div>

        <div class="add-section">
            <h3>➕ Add New Phrase</h3>
            <div class="add-form">
                <div class="form-row">
                    <input type="text" id="jpInput" placeholder="Japanese (e.g. ありがとう)" />
                    <input type="text" id="enInput" placeholder="English (e.g. Thank you)" />
                </div>
                <button class="btn-add-small" onclick="addPhrase()">Add Phrase</button>
            </div>
            <div class="phrase-list" id="phraseList"></div>
        </div>
    </div>

    <script>
        // Default phrases
        let phrases = [
            { japanese: 'こんにちは', english: 'Hello' },
            { japanese: 'ありがとう', english: 'Thank you' },
            { japanese: 'さようなら', english: 'Goodbye' },
            { japanese: 'おやすみなさい', english: 'Good night' },
            { japanese: 'すみません', english: 'Excuse me / Sorry' },
            { japanese: 'はい', english: 'Yes' },
            { japanese: 'いいえ', english: 'No' },
            { japanese: 'お願いします', english: 'Please' },
            { japanese: 'トイレはどこですか', english: 'Where is the toilet?' },
            { japanese: 'いくらですか', english: 'How much is it?' }
        ];

        let currentIndex = 0;
        let isShowingEnglish = false;

        // Load from localStorage
        function loadPhrases() {
            const saved = localStorage.getItem('japanesePhrases');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    if (parsed.length > 0) phrases = parsed;
                } catch (e) {}
            }
            updateUI();
        }

        // Save to localStorage
        function savePhrases() {
            localStorage.setItem('japanesePhrases', JSON.stringify(phrases));
        }

        function updateUI() {
            if (phrases.length === 0) {
                document.getElementById('japaneseText').textContent = 'No phrases yet!';
                document.getElementById('englishText').textContent = 'Add some above';
                document.getElementById('englishText').classList.remove('show');
                document.getElementById('progress').textContent = '0 / 0';
                return;
            }

            if (currentIndex >= phrases.length) currentIndex = 0;
            if (currentIndex < 0) currentIndex = phrases.length - 1;

            const phrase = phrases[currentIndex];
            document.getElementById('japaneseText').textContent = phrase.japanese;
            document.getElementById('englishText').textContent = phrase.english;
            document.getElementById('englishText').classList.remove('show');
            isShowingEnglish = false;
            document.getElementById('progress').textContent = `${currentIndex + 1} / ${phrases.length}`;
            renderPhraseList();
            savePhrases();
        }

        function toggleCard() {
            const englishEl = document.getElementById('englishText');
            if (isShowingEnglish) {
                englishEl.classList.remove('show');
                isShowingEnglish = false;
            } else {
                englishEl.classList.add('show');
                isShowingEnglish = true;
            }
        }

        function nextCard() {
            if (phrases.length === 0) return;
            currentIndex = (currentIndex + 1) % phrases.length;
            updateUI();
        }

        function prevCard() {
            if (phrases.length === 0) return;
            currentIndex = (currentIndex - 1 + phrases.length) % phrases.length;
            updateUI();
        }

        function shuffleCards() {
            for (let i = phrases.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [phrases[i], phrases[j]] = [phrases[j], phrases[i]];
            }
            currentIndex = 0;
            updateUI();
        }

        function addPhrase() {
            const jpInput = document.getElementById('jpInput');
            const enInput = document.getElementById('enInput');
            const jp = jpInput.value.trim();
            const en = enInput.value.trim();

            if (!jp || !en) {
                alert('Please enter both Japanese and English phrases!');
                return;
            }

            phrases.push({ japanese: jp, english: en });
            jpInput.value = '';
            enInput.value = '';
            currentIndex = phrases.length - 1;
            updateUI();
        }

        function removePhrase(index) {
            if (confirm('Remove this phrase?')) {
                phrases.splice(index, 1);
                if (currentIndex >= phrases.length) currentIndex = phrases.length - 1;
                updateUI();
            }
        }

        function renderPhraseList() {
            const list = document.getElementById('phraseList');
            list.innerHTML = phrases.map((p, i) => `
                <div class="phrase-item">
                    <span><span class="jp">${p.japanese}</span> — <span class="en">${p.english}</span></span>
                    <button class="btn-remove" onclick="removePhrase(${i})">✕</button>
                </div>
            `).join('');
        }

        // Event listeners
        document.getElementById('flashcard').addEventListener('click', toggleCard);

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextCard();
            if (e.key === 'ArrowLeft') prevCard();
            if (e.key === ' ') { e.preventDefault(); toggleCard(); }
        });

        // Initialize
        loadPhrases();
    </script>
</body>
</html>
